openapi: 3.0.0
info:
  title: TE Evaluation Tool API
  description: API for running and managing the standardized evaluation tooling for transposable element classifiers (TE Evaluation Tool v1.0.0).
  version: 1.0.0
servers:
  - url: http://localhost:3002/api/v1
    description: Application server (Docker)
tags:
  - name: Core
    description: Core commands for classification and validation.
  - name: Evaluation
    description: Commands for evaluation metrics and comparison of results.

paths:
  /run:
    post:
      tags:
        - Core
      summary: Run classification (asynchronous)
      description: |
        Starts a classification job in the background. The API returns **200 OK immediately**.

        **API-enforced defaults:**
        - **output**: auto-generated if omitted
        - **cleanTemp**: always TRUE
        - **verbose**: always TRUE

        Note: the TERL model ignores the 'algorithm' parameter.
      operationId: runClassification
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                notificationEmail:
                  $ref: '#/components/schemas/EmailNotificationRequest/properties/notificationEmail'
                fastaFile:
                  type: string
                  format: binary
                  description: "Input FASTA file for classification (form field: 'fastaFile')."
                model:
                  type: string
                  enum: [classifyte, terl, yoro]
                  default: classifyte
                  description: Model to run. Use 'yoro' to run the YORO pipeline (deep-learning object detection).
                modelFile:
                  type: string
                  description: "Model file to load (e.g. ClassifyTE_combined.pkl, DS3, or a YORO weights path like './src/models/YORO/models/AAqqYOLOqqdomainqqV25.hdf5')."
                # YORO-specific options
                window:
                  type: integer
                  default: 50000
                  description: "(YORO) Window size for object detection and sequence splitting. Corresponds to CLI -w / --window. Default: 50000."
                threads:
                  type: integer
                  description: "(YORO) Number of threads/cores used by the YORO pipeline (-p / --threads). If omitted, the pipeline uses all available cores."
                threshold:
                  type: number
                  format: float
                  default: 0.8
                  description: "(YORO) Threshold for presence filter used in object detection (-t / --threshold). Default: 0.8."
                cycles:
                  type: integer
                  default: 1
                  description: "(YORO) Number of cycles for detection (-c / --cycles). Default: 1."
                autoLabel:
                  type: boolean
                  default: false
                  description: "(Runner) When true, attempt to map predicted labels against the FASTA headers to include Actual_Label for evaluation."
                output:
                  type: string
                  description: Output directory where results will be written. **(Optional)** If omitted, the API will generate a directory.
                algorithm:
                  type: string
                  enum: [lcpnb, nllcpn]
                  default: lcpnb
                  description: Hierarchical algorithm (ClassifyTE only).
                nodeFile:
                  type: string
                  default: node.txt
                  description: Hierarchy node file.
                skipEvaluation:
                  type: boolean
                  default: false
                  description: Skip automatic metrics evaluation.
                cleanTemp:
                  type: boolean
                  default: true
                  description: Remove temporary files after execution (API enforces TRUE).
                verbose:
                  type: boolean
                  default: true
                  description: Verbose mode (API enforces TRUE).
              required:
                - fastaFile
                - notificationEmail
            examples:
              yoro-default:
                summary: "Run YORO with sensible defaults and automatic label mapping"
                value:
                  notificationEmail: "user@example.com"
                  model: "yoro"
                  modelFile: "./src/models/YORO/models/AAqqYOLOqqdomainqqV25.hdf5"
                  window: 50000
                  threads: 4
                  threshold: 0.8
                  cycles: 1
                  autoLabel: true
              classifyte-minimal:
                summary: "Run ClassifyTE with minimal fields"
                value:
                  notificationEmail: "user@example.com"
                  model: "classifyte"
              terl-DS3:
                summary: "Run TERL using a DS3 model folder reference"
                value:
                  notificationEmail: "user@example.com"
                  model: "terl"
                  modelFile: "DS3"
      responses:
        '200':
          description: Process started successfully (job queued).
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Classification queued successfully and will be processed sequentially.
                  output:
                    type: string
                    example: /app/data/results/run_1701000000000
                  status:
                    type: string
                    example: QUEUED
              examples:
                queued:
                  summary: "Successful queue response"
                  value:
                    message: "Classificação enfileirada com sucesso e será processada sequencialmente."
                    jobId: "JOB-1701000000000-123"
                    output: "/app/data/results/run_1701000000000"
                    status: "QUEUED"
        '500':
          description: "Pre-processing failed (e.g., file not uploaded or write error)."

  /map-labels:
    post:
      tags:
        - Core
      summary: Map FASTA headers to hierarchical codes (asynchronous)
      description: Starts the mapping process in the background. Returns 200 OK immediately.
      operationId: mapFastaLabels
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                notificationEmail:
                  $ref: '#/components/schemas/EmailNotificationRequest/properties/notificationEmail'
                fastaFile:
                  type: string
                  format: binary
                  description: "Input FASTA file (structured headers)."
                predictionsFile:
                  type: string
                  format: binary
                  description: "CSV file containing predictions to be merged with labels."
                output:
                  type: string
                  description: Output file/path for the results. (Auto-generated if omitted and validateOnly=false)
                validateOnly:
                  type: boolean
                  default: false
                  description: Only validate mappings (no output file will be generated).
                treeFile:
                  type: string
                  default: src/nodes/tree.txt
                  description: Hierarchy file path.
                verbose:
                  type: boolean
                  default: true
                  description: Modo verboso. (Forçado a TRUE pela API)
              required:
                - fastaFile
                - notificationEmail
            examples:
              map-default:
                summary: "Map headers and a predictions file"
                value:
                  notificationEmail: "user@example.com"
                  fastaFile: "file.fasta (upload)"
                  predictionsFile: "predictions.csv (upload)"
                  validateOnly: false
              map-validate-only:
                summary: "Validate headers only (no output)"
                value:
                  notificationEmail: "user@example.com"
                  fastaFile: "file.fasta (upload)"
                  validateOnly: true
      responses:
        '200':
          description: Mapping process queued successfully.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Mapping queued successfully.
                  output:
                    type: string
                    example: data/results/nome_fasta_mapped.csv
                  status:
                    type: string
                    example: QUEUED
              examples:
                map-queued:
                  summary: "Mapping job queued"
                  value:
                    message: "Mapeamento enfileirado com sucesso."
                    output: "data/results/nome_fasta_mapped.csv"
                    status: "QUEUED"
        '500':
          description: Pre-processing failed (file upload or validation error).

  /evaluate:
    post:
      tags:
        - Evaluation
      summary: Evaluate predictions with standardized metrics (asynchronous)
      description: |
        Accepts a CSV containing predictions and computes comprehensive evaluation metrics (F1, Cohen's kappa, hierarchical metrics).
        Returns 200 OK immediately after the job is queued.
      operationId: evaluateMetrics
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                notificationEmail:
                  $ref: '#/components/schemas/EmailNotificationRequest/properties/notificationEmail'
                predictionsFile:
                  type: string
                  format: binary
                  description: "CSV file containing predictions and ground-truth labels (must include 'Actual_Label' and 'Predicted label'). (form field: predictionsFile)"
                output:
                  type: string
                  description: Output directory for metrics files (JSON and CSV). **(Optional)** Will be auto-generated if omitted.
                hierarchy:
                  type: string
                  default: src/nodes/tree.txt
                  description: Hierarchy file used for hierarchical metrics calculations.
                format:
                  type: string
                  enum: [summary, detailed, json]
                  default: detailed
                  description: Format of the main output report.
                verbose:
                  type: boolean
                  default: true
                  description: Modo verboso. (Forçado a TRUE pela API).
              required:
                - predictionsFile
                - notificationEmail
            examples:
              eval-default:
                summary: "Evaluate predictions (detailed report)"
                value:
                  notificationEmail: "user@example.com"
                  predictionsFile: "predictions_with_labels.csv (upload)"
                  format: detailed
              eval-json:
                summary: "Evaluate predictions and request JSON metrics only"
                value:
                  notificationEmail: "user@example.com"
                  predictionsFile: "predictions_with_labels.csv (upload)"
                  format: json
      responses:
        '200':
          description: Evaluation process queued successfully.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Evaluation queued successfully.
                  jobId:
                    type: string
                  output:
                    type: string
                    example: /app/data/results/evaluation_1701000000000
                  status:
                    type: string
                    example: QUEUED
              examples:
                eval-queued:
                  summary: "Evaluation queued"
                  value:
                    message: "Avaliação enfileirada com sucesso."
                    jobId: "JOB-1701000000000-456"
                    output: "/app/data/results/evaluation_1701000000000"
                    status: "QUEUED"
        '500':
          description: Pre-processing failed (file upload or validation error).

components:
  schemas:
    GeneralParams:
      type: object
      properties:
        verbose:
          type: boolean
          description: "Verbose mode (optional, default: false)."
          default: false

    SimpleResponse:
      type: object
      properties:
        message:
          type: string
          description: Status message for the operation.

    EmailNotificationRequest:
      type: object
      properties:
        notificationEmail:
          type: string
          format: email
          description: Email address used to receive a link to the result files (CSV/JSON/log) after asynchronous processing completes.
      required:
        - notificationEmail